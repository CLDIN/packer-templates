spec:
    inputs:
        template_name:
            type: string
            description: name of the template to build, test and publish

---

# This job template defines the build for a single OS template
# The rules attached here make sure that templates are only (re)build on changes to their or shared files.
build:$[[ inputs.template_name ]]:
    stage: build
    tags:
        - virt
        - packer
    artifacts:
        paths:
            - build_$[[ inputs.template_name ]]/
    script:
        - make build NAME=$[[ inputs.template_name ]]
    rules:
        - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
        - if: $CI_PIPELINE_SOURCE == "merge_request_event"
          changes:
            - .gitlab-ci.yml
            - Makefile
            - files/**/*
            - templates/$[[ inputs.template_name ]].json
            - tpl/**/*
            - scripts/**/*

# Publish a built template by uploading it to an S3 bucket, the objects are prefixed with the name of the branch/tag
publish:$[[ inputs.template_name ]]:
    stage: publish
    image: "ubuntu:24.04"
    dependencies:
        - build:$[[ inputs.template_name ]]  # Match the exact build job name
    rules:
        - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
          when: on_success
    script:
        - find . -type f
        - apt-get update
        - apt-get -y install s3cmd curl
        - echo "[default]"|tee ${S3CFG} > /dev/null
        - echo "access_key = ${OBJECTS_ACCESS_KEY}"|tee -a ${S3CFG} > /dev/null
        - echo "secret_key = ${OBJECTS_SECRET_KEY}"|tee -a ${S3CFG} > /dev/null
        - echo "host_bucket = %(bucket)s.${OBJECTS_HOST}"|tee -a ${S3CFG} > /dev/null
        - echo "host_base = ${OBJECTS_HOST}"|tee -a ${S3CFG} > /dev/null
        - echo "use_https = False"|tee -a ${S3CFG} > /dev/null
        - s3cmd -c ${S3CFG} put -P --no-preserve build_$[[ inputs.template_name ]]/$[[ inputs.template_name ]].json s3://${OBJECTS_BUCKET}/templates/$[[ inputs.template_name ]]_${CI_COMMIT_REF_NAME}_${CI_COMMIT_SHORT_SHA}.json
        - s3cmd -c ${S3CFG} put -P --no-preserve build_$[[ inputs.template_name ]]/$[[ inputs.template_name ]].checksum s3://${OBJECTS_BUCKET}/templates/$[[ inputs.template_name ]]_${CI_COMMIT_REF_NAME}_${CI_COMMIT_SHORT_SHA}.checksum
        - s3cmd -c ${S3CFG} put -P --no-preserve build_$[[ inputs.template_name ]]/$[[ inputs.template_name ]].qcow2 s3://${OBJECTS_BUCKET}/templates/$[[ inputs.template_name ]]_${CI_COMMIT_REF_NAME}_${CI_COMMIT_SHORT_SHA}.qcow2
        - sleep 5
        - curl -I http://${OBJECTS_BUCKET}.${OBJECTS_HOST}/templates/$[[ inputs.template_name ]]_${CI_COMMIT_REF_NAME}_${CI_COMMIT_SHORT_SHA}.checksum
        - curl -I http://${OBJECTS_BUCKET}.${OBJECTS_HOST}/templates/$[[ inputs.template_name ]]_${CI_COMMIT_REF_NAME}_${CI_COMMIT_SHORT_SHA}.json
        - curl -I http://${OBJECTS_BUCKET}.${OBJECTS_HOST}/templates/$[[ inputs.template_name ]]_${CI_COMMIT_REF_NAME}_${CI_COMMIT_SHORT_SHA}.qcow2
